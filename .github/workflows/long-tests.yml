name: Long Tests [DISABLED]

# DISABLED: iOS tests disabled per project requirements.
# Only macOS unit tests, UI tests, and integration tests should run.

on:
  # DISABLED - iOS tests disabled
  # schedule:
  #   - cron: '0 2 * * 6'  # Saturday at 2 AM UTC
  #   - cron: '0 2 * * 0'  # Sunday at 2 AM UTC
  workflow_dispatch:  # Allow manual triggering only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-long:
    name: iOS Tests (Long)
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Create iPhone Simulator
        run: |
          echo "📱 Creating iPhone simulator for testing"
          RUNTIME=$(xcrun simctl list runtimes iOS -j | jq -r '.runtimes | sort_by(.version) | last | .identifier')
          echo "Using runtime: $RUNTIME"

          for DEVICE in "iPhone-16-Pro" "iPhone-16" "iPhone-15-Pro" "iPhone-15"; do
            DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.$DEVICE"
            UDID=$(xcrun simctl create "iPhone-Test" "$DEVICE_TYPE" "$RUNTIME" 2>&1 || echo "")
            if [[ -n "$UDID" && "$UDID" != *"error"* ]]; then
              echo "✅ Created simulator: $UDID"
              xcrun simctl boot "$UDID" || true
              break
            fi
          done

      - name: Build for iOS Simulator
        run: |
          echo "🔨 Building for iOS Simulator (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone-Test' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run long tests on iOS Simulator
        timeout-minutes: 15
        run: |
          set +e

          TOTAL_CPUS=$(sysctl -n hw.ncpu)
          echo "🖥️  Total CPUs: $TOTAL_CPUS"
          echo "🧪 Running long tests on iOS Simulator (using LongTests.xctestplan)"

          # Run tests with xcodebuild for iOS Simulator using LongTests test plan
          xcodebuild test \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone-Test' \
            -testPlan LongTests \
            -enableCodeCoverage YES \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers $TOTAL_CPUS \
            CODE_SIGNING_ALLOWED=NO \
            > test_output_long.txt 2>&1
          TEST_EXIT_CODE=$?
          cat test_output_long.txt

          # Check if tests passed
          if grep -q "Test run with .* tests in .* suites passed\|TEST SUCCEEDED" test_output_long.txt; then
            echo "✅ All long tests passed"
            exit 0
          else
            echo "❌ Long tests failed"
            exit $TEST_EXIT_CODE
          fi

      - name: Generate coverage report
        continue-on-error: true
        run: |
          echo "📊 Generating coverage report from xcodebuild results"

          # Find the most recent .xcresult bundle
          XCRESULT=$(find ~/Library/Developer/Xcode/DerivedData -name "*.xcresult" -type d -print0 | xargs -0 ls -td | head -n 1)

          if [ -z "$XCRESULT" ]; then
            echo "⚠️  No .xcresult bundle found - skipping coverage report"
            exit 0
          fi

          echo "Using xcresult: $XCRESULT"

          # Export coverage data
          xcrun xccov view --report --json "$XCRESULT" > coverage.json 2>/dev/null || {
            echo "⚠️  Failed to generate coverage report"
            exit 0
          }

          echo "✅ Coverage report generated"

      - name: Upload coverage to Codecov
        if: hashFiles('coverage.json') != ''
        continue-on-error: true
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.json
          fail_ci_if_error: false

      - name: Generate test summary
        if: always()
        run: |
          echo "## Long Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scheduled run**: Weekend integration and UI tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f test_output_long.txt ]; then
            TEST_COUNT=$(grep -o "Executed [0-9]* tests" test_output_long.txt | head -1)
            echo "**Tests**: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Long Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "- IntegrationTests" >> $GITHUB_STEP_SUMMARY
          echo "- ElementViewTests" >> $GITHUB_STEP_SUMMARY
          echo "- AudioPlayerManagerTests" >> $GITHUB_STEP_SUMMARY
          echo "- TruncationDebugTests" >> $GITHUB_STEP_SUMMARY
          echo "- GeneratedContentSortingTests" >> $GITHUB_STEP_SUMMARY
          echo "- FountainParserProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- FDXParserProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- SwiftDataProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- PDFScreenplayParserTests" >> $GITHUB_STEP_SUMMARY
          echo "- DocumentImportTests" >> $GITHUB_STEP_SUMMARY
          echo "- DocumentExportTests" >> $GITHUB_STEP_SUMMARY
          echo "- FileIOProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- TextPackWriterProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- FountainParserTests" >> $GITHUB_STEP_SUMMARY
          echo "- GuionSerializationTests" >> $GITHUB_STEP_SUMMARY
          echo "- GuionParsedElementCollectionParsingTests" >> $GITHUB_STEP_SUMMARY
          echo "- TextPackTests" >> $GITHUB_STEP_SUMMARY
          echo "- TypedDataStorageTests" >> $GITHUB_STEP_SUMMARY
          echo "- CloudKitSupportTests" >> $GITHUB_STEP_SUMMARY
          echo "- UIOrderingRegressionTests" >> $GITHUB_STEP_SUMMARY
          echo "- ElementProgressStateTests" >> $GITHUB_STEP_SUMMARY
          echo "- ElementOrderingTests" >> $GITHUB_STEP_SUMMARY
          echo "- LongPressGestureTests" >> $GITHUB_STEP_SUMMARY
          echo "- FountainTextFormatterTests" >> $GITHUB_STEP_SUMMARY
          echo "- TitlePageTests" >> $GITHUB_STEP_SUMMARY
          echo "- OperationProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- HoverTimingTests" >> $GITHUB_STEP_SUMMARY
          echo "- HoverStateManagementTests" >> $GITHUB_STEP_SUMMARY

  test-long-macos:
    name: macOS Tests (Long)
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build for macOS
        run: |
          echo "🔨 Building for macOS (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run long tests on macOS
        timeout-minutes: 15
        run: |
          set +e

          TOTAL_CPUS=$(sysctl -n hw.ncpu)
          echo "🖥️  Total CPUs: $TOTAL_CPUS"
          echo "🧪 Running long tests on macOS (using LongTests.xctestplan)"

          # Run tests with xcodebuild for macOS using LongTests test plan
          xcodebuild test \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -testPlan LongTests \
            -enableCodeCoverage YES \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers $TOTAL_CPUS \
            CODE_SIGNING_ALLOWED=NO \
            > test_output_long_macos.txt 2>&1
          TEST_EXIT_CODE=$?
          cat test_output_long_macos.txt

          # Check if tests passed
          if grep -q "Test run with .* tests in .* suites passed\|TEST SUCCEEDED" test_output_long_macos.txt; then
            echo "✅ All long tests passed"
            exit 0
          else
            echo "❌ Long tests failed"
            exit $TEST_EXIT_CODE
          fi

      - name: Generate coverage report
        continue-on-error: true
        run: |
          echo "📊 Generating coverage report from xcodebuild results"

          # Find the most recent .xcresult bundle
          XCRESULT=$(find ~/Library/Developer/Xcode/DerivedData -name "*.xcresult" -type d -print0 | xargs -0 ls -td | head -n 1)

          if [ -z "$XCRESULT" ]; then
            echo "⚠️  No .xcresult bundle found - skipping coverage report"
            exit 0
          fi

          echo "Using xcresult: $XCRESULT"

          # Export coverage data
          xcrun xccov view --report --json "$XCRESULT" > coverage_macos.json 2>/dev/null || {
            echo "⚠️  Failed to generate coverage report"
            exit 0
          }

          echo "✅ Coverage report generated"

      - name: Upload coverage to Codecov
        if: hashFiles('coverage_macos.json') != ''
        continue-on-error: true
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage_macos.json
          flags: macos
          fail_ci_if_error: false

      - name: Generate test summary
        if: always()
        run: |
          echo "## Long Test Results (macOS)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scheduled run**: Weekend integration and UI tests on macOS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f test_output_long_macos.txt ]; then
            TEST_COUNT=$(grep -o "Executed [0-9]* tests" test_output_long_macos.txt | head -1)
            echo "**Tests**: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Long Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "- IntegrationTests" >> $GITHUB_STEP_SUMMARY
          echo "- ElementViewTests" >> $GITHUB_STEP_SUMMARY
          echo "- AudioPlayerManagerTests" >> $GITHUB_STEP_SUMMARY
          echo "- TruncationDebugTests" >> $GITHUB_STEP_SUMMARY
          echo "- GeneratedContentSortingTests" >> $GITHUB_STEP_SUMMARY
          echo "- FountainParserProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- FDXParserProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- SwiftDataProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- PDFScreenplayParserTests" >> $GITHUB_STEP_SUMMARY
          echo "- DocumentImportTests" >> $GITHUB_STEP_SUMMARY
          echo "- DocumentExportTests" >> $GITHUB_STEP_SUMMARY
          echo "- FileIOProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- TextPackWriterProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- FountainParserTests" >> $GITHUB_STEP_SUMMARY
          echo "- GuionSerializationTests" >> $GITHUB_STEP_SUMMARY
          echo "- GuionParsedElementCollectionParsingTests" >> $GITHUB_STEP_SUMMARY
          echo "- TextPackTests" >> $GITHUB_STEP_SUMMARY
          echo "- TypedDataStorageTests" >> $GITHUB_STEP_SUMMARY
          echo "- CloudKitSupportTests" >> $GITHUB_STEP_SUMMARY
          echo "- UIOrderingRegressionTests" >> $GITHUB_STEP_SUMMARY
          echo "- ElementProgressStateTests" >> $GITHUB_STEP_SUMMARY
          echo "- ElementOrderingTests" >> $GITHUB_STEP_SUMMARY
          echo "- LongPressGestureTests" >> $GITHUB_STEP_SUMMARY
          echo "- FountainTextFormatterTests" >> $GITHUB_STEP_SUMMARY
          echo "- TitlePageTests" >> $GITHUB_STEP_SUMMARY
          echo "- OperationProgressTests" >> $GITHUB_STEP_SUMMARY
          echo "- HoverTimingTests" >> $GITHUB_STEP_SUMMARY
          echo "- HoverStateManagementTests" >> $GITHUB_STEP_SUMMARY

  ai-tests-check:
    name: AI Tests Check
    runs-on: macos-26
    needs: [test-long, test-long-macos]
    # AI tests are informational only - don't block weekend runs
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Check Apple Intelligence availability
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║  🤖  Apple Intelligence AI Tests - Status Check           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "ℹ️  Apple Intelligence (Foundation Models) tests require:"
          echo "   • iOS 26.2+ or macOS 26.0+"
          echo "   • M1+ Mac or A17 Pro+ device"
          echo "   • Apple Intelligence enabled in System Settings"
          echo ""
          echo "⚠️  SKIPPED: Apple Intelligence is not available in CI"
          echo ""
          echo "GitHub Actions runs in a headless environment without:"
          echo "   • User consent for Apple Intelligence"
          echo "   • System Settings access to enable AI features"
          echo "   • Interactive session required for model downloads"
          echo ""
          echo "📋 AI test suite location:"
          echo "   Tests/SwiftCompartidoTests/PDFScreenplayParserAITests.swift (8 tests)"
          echo ""
          echo "🧪 To run AI tests manually on a device with Apple Intelligence:"
          echo "   ./Scripts/test-ai-features.sh --macos"
          echo "   ./Scripts/test-ai-features.sh --ios"
          echo ""
          echo "✅ AI tests are designed to skip gracefully when unavailable"
          echo "   The library automatically falls back to heuristic parsing"
          echo ""

      - name: Add AI tests notice to summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🤖 AI Tests Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ⚠️ Skipped (Apple Intelligence unavailable in CI)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Apple Intelligence tests require:" >> $GITHUB_STEP_SUMMARY
          echo "- iOS 26.2+ or macOS 26.0+" >> $GITHUB_STEP_SUMMARY
          echo "- M1+ Mac or A17 Pro+ device" >> $GITHUB_STEP_SUMMARY
          echo "- Apple Intelligence enabled in System Settings" >> $GITHUB_STEP_SUMMARY
          echo "- Interactive user session" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Manual Testing**: Run \`./Scripts/test-ai-features.sh\` on a device with Apple Intelligence enabled." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Graceful Degradation**: The library automatically falls back to heuristic PDF parsing when AI is unavailable." >> $GITHUB_STEP_SUMMARY
