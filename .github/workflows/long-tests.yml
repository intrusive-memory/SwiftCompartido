          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Long Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "- IntegrationTests" >> $GITHUB_STEP_SUMMARY
          echo "- ElementViewTests" >> $GITHUB_STEP_SUMMARY
