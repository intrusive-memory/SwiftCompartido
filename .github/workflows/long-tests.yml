      - name: Build for macOS
        run: |
          echo "🔨 Building for macOS (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run long tests on macOS
        timeout-minutes: 15
        run: |
          set +e

