name: UI Tests [DISABLED]

# DISABLED: iOS UI tests disabled per project requirements.
# Only macOS unit tests should run on PRs.

on:
  # DISABLED - iOS UI tests disabled
  # pull_request:
  #   branches: [main]
  workflow_dispatch:  # Allow manual triggering only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests-ios:
    name: iOS UI Tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Create iPhone Simulator
        run: |
          echo "📱 Creating iPhone simulator for testing"
          RUNTIME=$(xcrun simctl list runtimes iOS -j | jq -r '.runtimes | sort_by(.version) | last | .identifier')
          echo "Using runtime: $RUNTIME"

          for DEVICE in "iPhone-16-Pro" "iPhone-16" "iPhone-15-Pro" "iPhone-15"; do
            DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.$DEVICE"
            UDID=$(xcrun simctl create "iPhone-Test" "$DEVICE_TYPE" "$RUNTIME" 2>&1 || echo "")
            if [[ -n "$UDID" && "$UDID" != *"error"* ]]; then
              echo "✅ Created simulator: $UDID"
              xcrun simctl boot "$UDID" || true
              break
            fi
          done

      - name: Build for iOS Simulator
        run: |
          echo "🔨 Building for iOS Simulator (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone-Test' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI tests on iOS Simulator
        run: |
          set +e

          echo "🎨 Running UI tests on iOS Simulator (20 UI test suites)"

          # Run only UI tests (Swift Packages don't support .xctestplan files)
          xcodebuild test \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone-Test' \
            -only-testing:SwiftCompartidoTests/AudioPlayerManagerTests \
            -only-testing:SwiftCompartidoTests/DialogueBlockViewTests \
            -only-testing:SwiftCompartidoTests/ElementProgressBarTests \
            -only-testing:SwiftCompartidoTests/ElementProgressStateTests \
            -only-testing:SwiftCompartidoTests/ElementViewTests \
            -only-testing:SwiftCompartidoTests/GeneratedContentDisplayTests \
            -only-testing:SwiftCompartidoTests/GuionElementPopoverEnvironmentTests \
            -only-testing:SwiftCompartidoTests/GuionElementPopoverProviderTests \
            -only-testing:SwiftCompartidoTests/GuionElementsListTests \
            -only-testing:SwiftCompartidoTests/GuionTextEditorTests \
            -only-testing:SwiftCompartidoTests/GuionViewerTests \
            -only-testing:SwiftCompartidoTests/HoverStateManagementTests \
            -only-testing:SwiftCompartidoTests/HoverTimingTests \
            -only-testing:SwiftCompartidoTests/InteractivePopoverTests \
            -only-testing:SwiftCompartidoTests/LongPressGestureTests \
            -only-testing:SwiftCompartidoTests/MarkdownViewTests \
            -only-testing:SwiftCompartidoTests/PopoverAccessibilityTests \
            -only-testing:SwiftCompartidoTests/PreSceneBoxTests \
            -only-testing:SwiftCompartidoTests/SceneBrowserUITests \
            -only-testing:SwiftCompartidoTests/SpectrogramVisualizerViewTests \
            -only-testing:SwiftCompartidoTests/TypedDataImageViewTests \
            -only-testing:SwiftCompartidoTests/UIOrderingRegressionTests \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            > ui_test_output.txt 2>&1
          TEST_EXIT_CODE=$?
          cat ui_test_output.txt

          # Check if tests passed
          if grep -q "Test Suite 'Selected tests' passed\|TEST SUCCEEDED" ui_test_output.txt; then
            echo "✅ All UI tests passed"
            exit 0
          else
            echo ""
            echo "❌ ============================================"
            echo "❌ UI TESTS FAILED"
            echo "❌ ============================================"
            echo ""

            # Show failed tests
            echo "📋 Failed Tests:"
            grep "Test Case.*failed" ui_test_output.txt || echo "  No specific test failures found in output"

            echo ""
            echo "🔍 Error Messages:"
            grep -E "error:|failed with|Assertion failed|Expected|Fatal error|does not have" ui_test_output.txt | head -20 || echo "  No error messages found"

            echo ""
            echo "📊 Test Summary:"
            grep -E "Test Suite|Testing failed|passed with|failed with" ui_test_output.txt | tail -10 || echo "  No summary found"

            echo ""
            echo "❌ ============================================"
            exit $TEST_EXIT_CODE
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/ui-tests-ios.lcov
          flags: ui-tests-ios
          name: ui-tests-ios
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ui-tests-macos:
    name: macOS UI Tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build for macOS
        run: |
          echo "🔨 Building for macOS (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI tests on macOS
        run: |
          set +e

          echo "🎨 Running UI tests on macOS (20 UI test suites)"

          # Run only UI tests (Swift Packages don't support .xctestplan files)
          xcodebuild test \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -only-testing:SwiftCompartidoTests/AudioPlayerManagerTests \
            -only-testing:SwiftCompartidoTests/DialogueBlockViewTests \
            -only-testing:SwiftCompartidoTests/ElementProgressBarTests \
            -only-testing:SwiftCompartidoTests/ElementProgressStateTests \
            -only-testing:SwiftCompartidoTests/ElementViewTests \
            -only-testing:SwiftCompartidoTests/GeneratedContentDisplayTests \
            -only-testing:SwiftCompartidoTests/GuionElementPopoverEnvironmentTests \
            -only-testing:SwiftCompartidoTests/GuionElementPopoverProviderTests \
            -only-testing:SwiftCompartidoTests/GuionElementsListTests \
            -only-testing:SwiftCompartidoTests/GuionTextEditorTests \
            -only-testing:SwiftCompartidoTests/GuionViewerTests \
            -only-testing:SwiftCompartidoTests/HoverStateManagementTests \
            -only-testing:SwiftCompartidoTests/HoverTimingTests \
            -only-testing:SwiftCompartidoTests/InteractivePopoverTests \
            -only-testing:SwiftCompartidoTests/LongPressGestureTests \
            -only-testing:SwiftCompartidoTests/MarkdownViewTests \
            -only-testing:SwiftCompartidoTests/PopoverAccessibilityTests \
            -only-testing:SwiftCompartidoTests/PreSceneBoxTests \
            -only-testing:SwiftCompartidoTests/SceneBrowserUITests \
            -only-testing:SwiftCompartidoTests/SpectrogramVisualizerViewTests \
            -only-testing:SwiftCompartidoTests/TypedDataImageViewTests \
            -only-testing:SwiftCompartidoTests/UIOrderingRegressionTests \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            > ui_test_output_macos.txt 2>&1
          TEST_EXIT_CODE=$?
          cat ui_test_output_macos.txt

          # Check if tests passed
          if grep -q "Test Suite 'Selected tests' passed\|TEST SUCCEEDED" ui_test_output_macos.txt; then
            echo "✅ All UI tests passed"
            exit 0
          else
            echo ""
            echo "❌ ============================================"
            echo "❌ MACOS UI TESTS FAILED"
            echo "❌ ============================================"
            echo ""

            # Show failed tests
            echo "📋 Failed Tests:"
            grep "Test Case.*failed" ui_test_output_macos.txt || echo "  No specific test failures found in output"

            echo ""
            echo "🔍 Error Messages:"
            grep -E "error:|failed with|Assertion failed|Expected|Fatal error|does not have" ui_test_output_macos.txt | head -20 || echo "  No error messages found"

            echo ""
            echo "📊 Test Summary:"
            grep -E "Test Suite|Testing failed|passed with|failed with" ui_test_output_macos.txt | tail -10 || echo "  No summary found"

            echo ""
            echo "❌ ============================================"
            exit $TEST_EXIT_CODE
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/ui-tests-macos.lcov
          flags: ui-tests-macos
          name: ui-tests-macos
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
