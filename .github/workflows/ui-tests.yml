name: UI Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests-ios:
    name: iOS UI Tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build for iOS Simulator
        run: |
          echo "🔨 Building for iOS Simulator (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.1' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI tests on iOS Simulator
        run: |
          set +e

          echo "🎨 Running UI tests on iOS Simulator (using UITests.xctestplan)"

          # Run tests using the UITests test plan
          xcodebuild test \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.1' \
            -testPlan UITests \
            -enableCodeCoverage YES \
            -parallel-testing-enabled YES \
            CODE_SIGNING_ALLOWED=NO \
            > ui_test_output.txt 2>&1
          TEST_EXIT_CODE=$?
          cat ui_test_output.txt

          # Check if tests passed
          if grep -q "Test run with .* tests in .* suites passed\|TEST SUCCEEDED" ui_test_output.txt; then
            echo "✅ All UI tests passed"
            exit 0
          else
            echo "❌ UI tests failed"
            exit $TEST_EXIT_CODE
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/ui-tests-ios.lcov
          flags: ui-tests-ios
          name: ui-tests-ios
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ui-tests-macos:
    name: macOS UI Tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build for macOS
        run: |
          echo "🔨 Building for macOS (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI tests on macOS
        run: |
          set +e

          echo "🎨 Running UI tests on macOS (using UITests.xctestplan)"

          # Run tests using the UITests test plan
          xcodebuild test \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -testPlan UITests \
            -enableCodeCoverage YES \
            -parallel-testing-enabled YES \
            CODE_SIGNING_ALLOWED=NO \
            > ui_test_output_macos.txt 2>&1
          TEST_EXIT_CODE=$?
          cat ui_test_output_macos.txt

          # Check if tests passed
          if grep -q "Test run with .* tests in .* suites passed\|TEST SUCCEEDED" ui_test_output_macos.txt; then
            echo "✅ All UI tests passed"
            exit 0
          else
            echo "❌ UI tests failed"
            exit $TEST_EXIT_CODE
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/ui-tests-macos.lcov
          flags: ui-tests-macos
          name: ui-tests-macos
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
