name: Tests

on:
  pull_request:
    branches: [main, development]
    # ready_for_review is not in GitHub's default event set. Without it,
    # promoting a draft PR never starts the suite. Jobs below skip on drafts.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test on macOS
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: make build

      # Test selection (skipped AI, migration and performance tests) lives in
      # the Makefile so local and CI runs share one list.
      - name: Test
        run: make test-ci
