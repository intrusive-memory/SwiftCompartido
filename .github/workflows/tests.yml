name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: iOS Tests
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build for iOS Simulator
        run: |
          echo "🔨 Building for iOS Simulator (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests on iOS Simulator
        run: |
          set +e

          TOTAL_CPUS=$(sysctl -n hw.ncpu)
          echo "🖥️  Total CPUs: $TOTAL_CPUS"
          echo "🧪 Running tests on iOS Simulator (long tests run on weekend schedule)"

          # Skip long-running test suites
          SKIP_TESTS=(
            "IntegrationTests"
            "ElementViewTests"
            "AudioPlayerManagerTests"
            "TruncationDebugTests"
            "GeneratedContentSortingTests"
            "FountainParserProgressTests"
            "FDXParserProgressTests"
            "SwiftDataProgressTests"
            "PDFScreenplayParserTests"
            "DocumentImportTests"
            "DocumentExportTests"
            "FileIOProgressTests"
            "TextPackWriterProgressTests"
            "FountainParserTests"
            "GuionSerializationTests"
            "GuionParsedElementCollectionParsingTests"
            "TextPackTests"
            "TypedDataStorageTests"
            "CloudKitSupportTests"
            "UIOrderingRegressionTests"
            "ElementProgressStateTests"
            "ElementOrderingTests"
            "LongPressGestureTests"
            "FountainTextFormatterTests"
            "TitlePageTests"
            "OperationProgressTests"
            "HoverTimingTests"
            "HoverStateManagementTests"
          )

          SKIP_ARGS=""
          for test in "${SKIP_TESTS[@]}"; do
            SKIP_ARGS="$SKIP_ARGS -skip-testing:SwiftCompartidoTests/$test"
          done

          # Run tests with xcodebuild for iOS Simulator
          xcodebuild test \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -enableCodeCoverage YES \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers $TOTAL_CPUS \
            $SKIP_ARGS \
            CODE_SIGNING_ALLOWED=NO \
            > test_output.txt 2>&1
          TEST_EXIT_CODE=$?
          cat test_output.txt

          # Check if tests passed
          if grep -q "Test run with .* tests in .* suites passed\|TEST SUCCEEDED" test_output.txt; then
            echo "✅ All tests passed"
            exit 0
          else
            echo "❌ Tests failed"
            exit $TEST_EXIT_CODE
          fi

  macos-test:
    name: macOS Tests
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build for macOS
        run: |
          echo "🔨 Building for macOS (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests on macOS
        run: |
          set +e

          TOTAL_CPUS=$(sysctl -n hw.ncpu)
          echo "🖥️  Total CPUs: $TOTAL_CPUS"
          echo "🧪 Running tests on macOS (long tests run on weekend schedule)"

          # Skip long-running test suites (same as iOS)
          SKIP_TESTS=(
            "IntegrationTests"
            "ElementViewTests"
            "AudioPlayerManagerTests"
            "TruncationDebugTests"
            "GeneratedContentSortingTests"
            "FountainParserProgressTests"
            "FDXParserProgressTests"
            "SwiftDataProgressTests"
            "PDFScreenplayParserTests"
            "DocumentImportTests"
            "DocumentExportTests"
            "FileIOProgressTests"
            "TextPackWriterProgressTests"
            "FountainParserTests"
            "GuionSerializationTests"
            "GuionParsedElementCollectionParsingTests"
            "TextPackTests"
            "TypedDataStorageTests"
            "CloudKitSupportTests"
            "UIOrderingRegressionTests"
            "ElementProgressStateTests"
            "ElementOrderingTests"
            "LongPressGestureTests"
            "FountainTextFormatterTests"
            "TitlePageTests"
            "OperationProgressTests"
            "HoverTimingTests"
            "HoverStateManagementTests"
          )

          SKIP_ARGS=""
          for test in "${SKIP_TESTS[@]}"; do
            SKIP_ARGS="$SKIP_ARGS -skip-testing:SwiftCompartidoTests/$test"
          done

          # Run tests with xcodebuild for macOS
          xcodebuild test \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers $TOTAL_CPUS \
            $SKIP_ARGS \
            CODE_SIGNING_ALLOWED=NO \
            > test_output_macos.txt 2>&1
          TEST_EXIT_CODE=$?
          cat test_output_macos.txt

          # Check if tests passed
          if grep -q "Test run with .* tests in .* suites passed\|TEST SUCCEEDED" test_output_macos.txt; then
            echo "✅ All tests passed"
            exit 0
          else
            echo "❌ Tests failed"
            exit $TEST_EXIT_CODE
          fi

  lint:
    name: Code Quality
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for TODOs in committed code
        run: |
          if git diff origin/main...HEAD | grep -E "^\+.*TODO|^\+.*FIXME"; then
            echo "⚠️  Warning: New TODOs or FIXMEs detected"
          fi

      - name: Check file sizes
        run: |
          find Sources -type f -name "*.swift" -size +100k -exec echo "⚠️  Large file: {}" \;

      - name: Check for print statements
        run: |
          if grep -r "print(" Sources/ --include="*.swift" | grep -v "// print"; then
            echo "⚠️  Warning: print() statements found in source code"
          fi
