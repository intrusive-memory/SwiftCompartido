name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step 1: Code Quality (runs first)
  code-quality:
    name: Code Quality
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for TODOs in committed code
        run: |
          if git diff origin/main...HEAD | grep -E "^\+.*TODO|^\+.*FIXME"; then
            echo "⚠️  Warning: New TODOs or FIXMEs detected"
          fi

      - name: Check file sizes
        run: |
          find Sources -type f -name "*.swift" -size +100k -exec echo "⚠️  Large file: {}" \;

      - name: Check for print statements
        run: |
          if grep -r "print(" Sources/ --include="*.swift" | grep -v "// print"; then
            echo "⚠️  Warning: print() statements found in source code"
          fi

  # Step 2: Unit Tests (runs after code quality passes)
  unit-tests-ios:
    name: iOS Unit Tests
    runs-on: macos-26
    needs: [code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Install Pandoc
        run: brew install pandoc

      - name: Build for iOS Simulator
        run: |
          echo "🔨 Building for iOS Simulator (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.1' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests on iOS Simulator
        run: |
          set +e

          echo "🧪 Running unit tests on iOS Simulator (integration and performance tests disabled)"

          # Skip long-running and integration test suites
          SKIP_TESTS=(
            "IntegrationTests"
            "ElementViewTests"
            "AudioPlayerManagerTests"
            "TruncationDebugTests"
            "GeneratedContentSortingTests"
            "FountainParserProgressTests"
            "FDXParserProgressTests"
            "SwiftDataProgressTests"
            "PDFScreenplayParserTests"
            "DocumentImportTests"
            "DocumentExportTests"
            "FileIOProgressTests"
            "TextPackWriterProgressTests"
            "FountainParserTests"
            "GuionSerializationTests"
            "GuionParsedElementCollectionParsingTests"
            "TextPackTests"
            "TypedDataStorageTests"
            "CloudKitSupportTests"
            "UIOrderingRegressionTests"
            "ElementProgressStateTests"
            "ElementOrderingTests"
            "LongPressGestureTests"
            "FountainTextFormatterTests"
            "TitlePageTests"
            "OperationProgressTests"
            "HoverTimingTests"
            "HoverStateManagementTests"
            "PerformanceTests"
            "PopoverAccessibilityTests"
            "SerializationFormatTests"
            "PandocIntegrationTests"
            "GuionTextEditorPerformanceTests"
            "SceneLocationTests"
          )

          SKIP_ARGS=""
          for test in "${SKIP_TESTS[@]}"; do
            SKIP_ARGS="$SKIP_ARGS -skip-testing:SwiftCompartidoTests/$test"
          done

          # Run tests with reduced parallelism
          xcodebuild test \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.1' \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            $SKIP_ARGS \
            CODE_SIGNING_ALLOWED=NO \
            > test_output.txt 2>&1
          TEST_EXIT_CODE=$?
          cat test_output.txt

          # Check if tests passed
          if grep -q "Test run with .* tests in .* suites passed\|TEST SUCCEEDED" test_output.txt; then
            echo "✅ All unit tests passed"
            exit 0
          else
            echo "❌ Unit tests failed"
            exit $TEST_EXIT_CODE
          fi

  unit-tests-macos:
    name: macOS Unit Tests
    runs-on: macos-26
    needs: [code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Install Pandoc
        run: brew install pandoc

      - name: Build for macOS
        run: |
          echo "🔨 Building for macOS (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests on macOS
        run: |
          set +e

          echo "🧪 Running unit tests on macOS (integration and performance tests disabled)"

          # Skip long-running and integration test suites (same as iOS)
          SKIP_TESTS=(
            "IntegrationTests"
            "ElementViewTests"
            "AudioPlayerManagerTests"
            "TruncationDebugTests"
            "GeneratedContentSortingTests"
            "FountainParserProgressTests"
            "FDXParserProgressTests"
            "SwiftDataProgressTests"
            "PDFScreenplayParserTests"
            "DocumentImportTests"
            "DocumentExportTests"
            "FileIOProgressTests"
            "TextPackWriterProgressTests"
            "FountainParserTests"
            "GuionSerializationTests"
            "GuionParsedElementCollectionParsingTests"
            "TextPackTests"
            "TypedDataStorageTests"
            "CloudKitSupportTests"
            "UIOrderingRegressionTests"
            "ElementProgressStateTests"
            "ElementOrderingTests"
            "LongPressGestureTests"
            "FountainTextFormatterTests"
            "TitlePageTests"
            "OperationProgressTests"
            "HoverTimingTests"
            "HoverStateManagementTests"
            "PerformanceTests"
          )

          SKIP_ARGS=""
          for test in "${SKIP_TESTS[@]}"; do
            SKIP_ARGS="$SKIP_ARGS -skip-testing:SwiftCompartidoTests/$test"
          done

          # Run tests with reduced parallelism
          xcodebuild test \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            $SKIP_ARGS \
            CODE_SIGNING_ALLOWED=NO \
            > test_output_macos.txt 2>&1
          TEST_EXIT_CODE=$?
          cat test_output_macos.txt

          # Check if tests passed
          if grep -q "Test run with .* tests in .* suites passed\|TEST SUCCEEDED" test_output_macos.txt; then
            echo "✅ All unit tests passed"
            exit 0
          else
            echo "❌ Unit tests failed"
            exit $TEST_EXIT_CODE
          fi

  # Step 3: Performance Tests (runs after unit tests pass)
  performance-tests:
    name: Performance Tests
    runs-on: macos-26
    needs: [unit-tests-ios, unit-tests-macos]
    # Performance tests are informational only - don't block PRs
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Install Pandoc
        run: brew install pandoc

      - name: Build for iOS Simulator
        run: |
          echo "🔨 Building for iOS Simulator (arm64)"
          xcodebuild build \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.1' \
            -configuration Release \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run performance tests
        run: |
          echo "🧪 Running performance tests (baseline and UI rendering)"

          set +e
          xcodebuild test \
            -scheme SwiftCompartido \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.1' \
            -configuration Release \
            -only-testing:SwiftCompartidoTests/PerformanceTests \
            -only-testing:SwiftCompartidoTests/GuionViewerPerformanceTests \
            CODE_SIGNING_ALLOWED=NO \
            > performance_output.txt 2>&1
          PERF_EXIT_CODE=$?

          cat performance_output.txt

          # Extract performance metrics
          grep -A 10 "📊 PERFORMANCE" performance_output.txt || echo "No performance metrics found"

          # Save performance results as artifact
          echo "Saving performance results..."
          mkdir -p performance_results
          cp performance_output.txt performance_results/performance_$(date +%Y%m%d_%H%M%S).txt

          # Performance tests don't block - always exit 0
          exit 0

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance_results/
          retention-days: 30
