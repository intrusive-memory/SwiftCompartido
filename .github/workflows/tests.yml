name: Tests

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme SwiftCompartido

      - name: Build
        run: xcodebuild build -scheme SwiftCompartido -destination 'platform=macOS'

      - name: Test
        run: |
          xcodebuild test \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -only-testing:SwiftCompartidoTests \
            -skip-testing:SwiftCompartidoTests/GuionDocumentSnapshotCastListTests \
            -skip-testing:SwiftCompartidoTests/CastListGenerationIntegrationTests
