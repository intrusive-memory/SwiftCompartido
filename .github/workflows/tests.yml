name: Tests

on:
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: make build

      # Test selection (skipped AI, migration and performance tests) lives in
      # the Makefile so local and CI runs share one list.
      - name: Test
        run: make test-ci
