name: Performance Tests

on:
  workflow_dispatch:

jobs:
  performance-macos:
    name: Performance Tests on macOS
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme SwiftCompartido

      - name: Run performance tests
        run: |
          xcodebuild test \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -only-testing:SwiftCompartidoTests/Phase2PerformanceTests \
            -only-testing:SwiftCompartidoTests/GuionViewerPerformanceTests \
            -only-testing:SwiftCompartidoTests/GuionTextEditorPerformanceTests
