name: Performance Tests

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-macos:
    name: Performance Tests on macOS
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme SwiftCompartido

      - name: Run performance tests
        run: |
          xcodebuild test \
            -scheme SwiftCompartido \
            -destination 'platform=macOS' \
            -only-testing:SwiftCompartidoPerformanceTests
